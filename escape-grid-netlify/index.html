<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escape the Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f3f6f4;--grid:#dbe5e3;--paper:#fff;--ink:#17223a;--muted:#5b6678;--line:#c9d3d6;--accent:#d9481f;--accent-ink:#fff;--ok:#21804f;--ok-soft:#e3f3ea;--warn:#b8610c;--warn-soft:#fbeedd;--bad:#c0322b;--bad-soft:#fbe7e5;--chip:#e8eef0;--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;--f-mono:"Martian Mono",ui-monospace,monospace}
*{box-sizing:border-box}body{margin:0;background-color:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:28px 16px 56px;display:flex;flex-direction:column;gap:18px}h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:800}h2{font-size:1.6rem}h3{font-size:1.1rem}p{margin:0}.eyebrow{font: .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.hero{display:flex;flex-direction:column;gap:10px}.hero h1 span{color:var(--accent);font:600 .5em var(--f-mono)}.lede{color:var(--muted);max-width:65ch}.card{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}.rules,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.rule,.stat{border:1.5px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}.rule b,.stat b{font:600 1.35rem var(--f-mono);color:var(--accent)}.rule span,.stat span{color:var(--muted);font-size:.9rem}label{font-weight:700}.field{display:flex;flex-direction:column;gap:6px}input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:11px 18px;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent);color:white}button:disabled{opacity:.45;cursor:not-allowed}.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.note,.hint{font-size:.9rem;color:var(--muted)}.err{color:var(--bad)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.team{font-weight:700;font-size:1.2rem}.timer{font:600 1.7rem var(--f-mono);font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}.doors{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}.door{aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);display:flex;align-items:flex-end;justify-content:center;font: .68rem var(--f-mono);color:var(--muted);padding-bottom:3px}.door.cur{border:2px solid var(--accent)}.door.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.door.forced{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.room-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.chip{font: .72rem var(--f-mono);background:var(--chip);padding:4px 9px;border-radius:99px}.prompt{font-size:1.12rem}.eqs{font:1.05rem var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}.answer-input{font:1.15rem var(--f-mono)}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.choice{font-family:var(--f-mono)}.choice[aria-pressed=true]{background:var(--ink);color:white}.tries{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}.dot.used{background:var(--bad);border-color:var(--bad)}.fb{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}.fb.ok{background:var(--ok-soft);border:1.5px solid var(--ok)}.fb.bad{background:var(--bad-soft);border:1.5px solid var(--bad)}.fb.warn{background:var(--warn-soft);border:1.5px solid var(--warn)}.graph{max-width:340px;width:100%;align-self:center}.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{font: .72rem var(--f-mono);text-transform:uppercase;color:var(--muted)}td.num{font-family:var(--f-mono)}.pill{font: .75rem var(--f-mono);padding:3px 8px;border-radius:99px}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.forced{background:var(--warn-soft);color:var(--warn)}.paused{border:2px dashed var(--accent);text-align:center;align-items:center;padding:32px}.code{font:800 clamp(2rem,8vw,3.2rem) var(--f-mono);letter-spacing:.15em;color:var(--accent)}.team-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.team-row strong{font-size:1.05rem}.teacher-actions{display:flex;gap:10px;flex-wrap:wrap}.leader{font:600 1.1rem var(--f-mono);color:var(--accent)}@media(max-width:520px){.card{padding:17px}.doors{gap:3px}.door{font-size:.58rem}}
</style>
</head>
<body><main class="wrap" id="app"><p>Loading Escape the Grid…</p></main>
<script>
(() => {
"use strict";
const TEACHER_PIN="7410", TIME_LIMIT=1800, API="/.netlify/functions/game";
const Q = [
 {topic:"What is a solution?", type:"mc", prompt:"Which ordered pair is a solution to BOTH equations?",
  eqs:["x + y = 7","2x − y = 2"], choices:["(4, 3)","(3, 4)","(2, 5)","(5, 2)"],
  why:"Check (3, 4): 3 + 4 = 7 ✓ and 2(3) − 4 = 2 ✓. The other pairs fail at least one equation."},
 {topic:"Number puzzle", type:"pair", prompt:"Two numbers have a sum of 20 and a difference of 8. Let x be the larger number. Enter the numbers as (x, y).",
  why:"x + y = 20 and x − y = 8. Add: 2x = 28, so x = 14 and y = 6."},
 {topic:"Graphing", type:"pair", prompt:"Where do Line A and Line B cross? Enter the point as (x, y).", graph:true,
  why:"Line A is y = −x + 4 and Line B is y = 2x − 2. They cross at (2, 2): −2 + 4 = 2 and 2(2) − 2 = 2."},
 {topic:"Substitution", type:"pair", prompt:"Solve the system. Enter (x, y).", eqs:["y = 4x − 7","y = 2x + 3"],
  why:"4x − 7 = 2x + 3, so 2x = 10 and x = 5. Then y = 2(5) + 3 = 13."},
 {topic:"Substitution", type:"pair", prompt:"Solve the system. Enter (x, y).", eqs:["x = 3y − 2","2x + y = 17"],
  why:"2(3y − 2) + y = 17, so 7y − 4 = 17, y = 3. Then x = 3(3) − 2 = 7."},
 {topic:"Spot the shortcut", type:"pair", prompt:"Solve the system. Enter (x, y). Fractions or decimals are fine.", eqs:["7x + 4y = 30","4y = x + 6"],
  why:"Replace 4y with x + 6: 7x + x + 6 = 30, so 8x = 24 and x = 3. Then 4y = 9, so y = 9/4 (2.25)."},
 {topic:"Elimination", type:"pair", prompt:"Solve the system. Enter (x, y).", eqs:["3x + y = 14","2x − y = 1"],
  why:"Add the equations: 5x = 15, so x = 3. Then 3(3) + y = 14, so y = 5."},
 {topic:"Elimination", type:"pair", prompt:"Solve the system. Enter (x, y).", eqs:["2x + 5y = −1","4x − 3y = 11"],
  why:"Multiply the first by −2: −4x − 10y = 2. Add: −13y = 13, so y = −1. Then 2x − 5 = −1, so x = 2."},
 {topic:"Elimination", type:"pair", prompt:"Solve the system. Enter (x, y).", eqs:["3x + 4y = 10","5x − 6y = 4"],
  why:"Multiply the first by 3 and the second by 2: 9x + 12y = 30 and 10x − 12y = 8. Add: 19x = 38, so x = 2. Then 6 + 4y = 10, so y = 1."},
 {topic:"How many solutions?", type:"mc", prompt:"How many solutions does this system have?", eqs:["6x − 3y = 9","y = 2x − 3"],
  choices:["Exactly one","No solution","Infinitely many"],
  why:"Rewrite 6x − 3y = 9 as y = 2x − 3. It is the same line as the second equation, so there are infinitely many solutions."},
 {topic:"How many solutions?", type:"num", prompt:"What value of k makes this system have NO solution? Enter k.", eqs:["y = 5x + 2","y = kx − 1"],
  why:"No solution means parallel lines: same slope, different intercepts. The intercepts (2 and −1) already differ, so k = 5."},
 {topic:"Word problem", type:"num", prompt:"A snack stand sells popcorn for $3 and lemonade for $2. It sold 85 items and made $210. How many bags of popcorn did it sell?",
  why:"p + l = 85 and 3p + 2l = 210. Multiply the first by −2 and add: p = 40. So 40 popcorn and 45 lemonades."}
];
const ENC = "WyIxIixbMTQsNl0sWzIsMl0sWzUsMTNdLFs3LDNdLFszLDIuMjVdLFszLDVdLFsyLC0xXSxbMiwxXSwiMiIsNSw0MF0=";
const ANS = JSON.parse(atob(ENC));
const SHOW = ["(3, 4)","(14, 6)","(2, 2)","(5, 13)","(7, 3)","(3, 9/4)","(3, 5)","(2, −1)","(2, 1)","Infinitely many","k = 5","40 bags"];
const UNSOLVED_COST=5;
function attemptPoints(t){return t<=14?1.5:t<=18?1:t<=24?.5:0}
function timePoints(sec){const m=sec/60;return m<=15?1.5:m<=20?1:m<=25?.5:0}
function scoreRun(r){const solved=(r.results||[]).filter(x=>x&&x.solved).length;const weighted=(r.results||[]).reduce((s,x)=>s+(x&&x.solved?x.tries:UNSOLVED_COST),0);const sec=Math.min(TIME_LIMIT,Math.round(r.used||0));if(solved<5)return{solved,weighted,sec,ap:0,tp:0,score:7,gated:true};const ap=attemptPoints(weighted),tp=timePoints(sec);return{solved,weighted,sec,ap,tp,score:7+ap+tp,gated:false}}
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
const nums=str=>String(str).replace(/[−–—]/g,"-").replace(/\s+/g,"").match(/-?\d*\.?\d+(?:\/-?\d*\.?\d+)?/g)?.map(x=>{if(x.includes("/")){let[a,b]=x.split("/").map(Number);return b===0?NaN:a/b}return Number(x)})||[];
const close=(a,b)=>Math.abs(a-b)<.011;
const params=new URLSearchParams(location.search), teacherMode=params.has("teacher");
let session=null, teamId=localStorage.getItem("eg-team-id"), teamState=null, mcPick=null, poller=null, ticker=null, busy=false;
let savedCode=localStorage.getItem(teacherMode?"eg-teacher-code":"eg-team-code");
async function api(method,body){const res=await fetch(API,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const data=await res.json();if(!res.ok)throw Error(data.error||"The game server could not complete that request.");return data}
function freshTeam(team,members,period){return{team,members,period,phase:"room",start:Date.now(),idx:0,tries:0,results:[],last:null,wrongMsg:"",used:0,timedOut:false,endedEarly:false}}
function elapsed(){if(!teamState)return 0;const stop=session?.pausedAt||Date.now();return Math.max(0,(stop-teamState.start-(session?.pausedTotal||0))/1000)}
function doors(){return `<div class="doors">${Q.map((_,i)=>{let r=teamState.results[i],c=r?(r.solved?"ok":"forced"):(i===teamState.idx?"cur":"");return `<div class="door ${c}">${i+1}</div>`}).join("")}</div>`}
function graphSVG(){const u=30,ox=80,oy=200,W=280,H=280,X=x=>ox+x*u,Y=y=>oy-y*u;let g="";for(let i=-2;i<=6;i++){g+=`<line x1="${X(i)}" y1="${Y(-2)}" x2="${X(i)}" y2="${Y(6)}" stroke="#c9d3d6"/><line x1="${X(-2)}" y1="${Y(i)}" x2="${X(6)}" y2="${Y(i)}" stroke="#c9d3d6"/>`}g+=`<line x1="${X(-2)}" y1="${Y(6)}" x2="${X(6)}" y2="${Y(-2)}" stroke="#2563b8" stroke-width="3"/><line x1="${X(0)}" y1="${Y(-2)}" x2="${X(4)}" y2="${Y(6)}" stroke="#d9481f" stroke-width="3"/>`;return `<svg class="graph" viewBox="0 0 ${W} ${H}">${g}</svg>`}
function renderStart(){return `<header class="hero"><span class="eyebrow">Pre-AP Algebra 1 · Lessons 1.12–1.14</span><h1>Escape the Grid <span>(x, y)</span></h1><p class="lede">Your team is locked inside a building made of graph paper. Work together to unlock all 12 doors before time runs out.</p></header><section class="card"><div class="rules"><div class="rule"><b>12</b><span>doors, one question each</span></div><div class="rule"><b>3</b><span>tries per door</span></div><div class="rule"><b>30:00</b><span>team countdown</span></div></div><p class="hint">Type ordered pairs like (2, -3). Fractions such as 9/4 and decimals such as 2.25 both work.</p></section><form class="card" id="joinForm"><h2>Join your team</h2><div class="field"><label>Game code</label><input id="code" maxlength="6" autocomplete="off" placeholder="6-character code" required></div><div class="field"><label>Team name</label><input id="team" maxlength="40" required></div><div class="field"><label>Team members</label><input id="members" maxlength="160" placeholder="Names separated by commas" required></div><div class="field"><label>Period</label><select id="period"><option>P5</option><option>P8</option></select></div><p class="err" id="error"></p><button class="primary">Join game</button></form><p class="note">Teacher? Open this page with <b>?teacher=1</b> to create and manage a game.</p>`}
function renderTeacher(){let teams=Object.values(session?.teams||{}).map(t=>({id:t.id,...(t.state||{})})).sort((a,b)=>scoreRun(b).score-scoreRun(a).score);return `<header class="hero"><span class="eyebrow">Teacher dashboard · Escape the Grid</span><h1>Teacher Control Room</h1><p class="lede">Create a game, share its code, monitor team progress, and pause or resume every team's clock from here.</p></header>${!session?`<section class="card"><h2>Create a game</h2><div class="field"><label>Teacher code</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter teacher code"></div><p class="err" id="error"></p><button class="primary" id="create">Generate game code</button></section>`:`<section class="card"><span class="eyebrow">Share this with every team</span><div class="code">${session.code}</div><p class="note">Teams open the same site, enter this code, and join with their team details.</p><div class="teacher-actions"><button class="primary" id="pause">${session.pausedAt?"Resume all teams":"Pause all teams"}</button><button id="refresh">Refresh dashboard</button></div><p class="note">${session.pausedAt?"All team clocks are paused.":"Game is running."} ${Object.keys(session.teams||{}).length} teams joined.</p></section><section class="card"><h2>Live leaderboard</h2>${teams.length?`<div class="tbl"><table><thead><tr><th>Rank</th><th>Team</th><th>Period</th><th>Doors</th><th>Score</th><th>Status</th></tr></thead><tbody>${teams.map((t,i)=>{let sc=scoreRun(t);return `<tr><td class="num">${i+1}</td><td><b>${esc(t.team)}</b><br><span class="note">${esc(t.members)}</span></td><td>${esc(t.period)}</td><td class="num">${sc.solved}/12</td><td class="num">${sc.score.toFixed(1)}</td><td>${t.phase==="done"?"Finished":session.pausedAt?"Paused":"Playing"}</td></tr>`}).join("")}</tbody></table></div>`:`<p class="note">Waiting for teams to join…</p>`}</section>`}<p class="note">Teacher controls appear only on this dashboard. Team devices never receive a pause button.</p>`}
function renderTeam(){let s=teamState;if(!s)return renderStart();if(session.pausedAt)return `<div class="bar"><div><div class="eyebrow">${esc(s.period)} · Group</div><div class="team">${esc(s.team)}</div></div><div><div class="eyebrow">Time left</div><div class="timer">${fmt(TIME_LIMIT-elapsed())}</div></div></div>${doors()}<section class="card paused"><span class="eyebrow">Paused by your teacher</span><h2>The grid is frozen</h2><p>Your clock is stopped. Your progress is saved. Your teacher will resume the game.</p></section>`;
if(s.phase==="done"){let sc=scoreRun(s);return `<header class="hero"><span class="eyebrow">${esc(s.period)} · Escape the Grid</span><h1>${s.timedOut?"Time ran out":"You escaped the grid"}</h1><p class="lede"><b>${esc(s.team)}</b> · ${esc(s.members)}</p></header><section class="card"><div class="stats"><div class="stat"><span>Score</span><b>${sc.score.toFixed(1)}/10</b></div><div class="stat"><span>Time used</span><b>${fmt(sc.sec)}</b></div><div class="stat"><span>Doors solved</span><b>${sc.solved}/12</b></div></div><h3>Results by door</h3><div class="tbl"><table><tr><th>Door</th><th>Topic</th><th>Tries</th><th>Result</th></tr>${s.results.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(Q[i].topic)}</td><td>${r.tries}</td><td>${r.solved?"Solved":r.unreached?"Not reached":"Not solved"}</td></tr>`).join("")}</table></div></section>`}
let q=Q[s.idx],done=!!s.last,dots=Array.from({length:3},(_,i)=>`<span class="dot ${i<s.tries?"used":""}"></span>`).join("");let input=q.type==="mc"?`<div class="choices">${q.choices.map((c,i)=>`<button type="button" class="choice" data-i="${i}" aria-pressed="${mcPick===i}" ${done?"disabled":""}>${esc(c)}</button>`).join("")}</div>`:`<div class="field"><label>Your answer</label><input id="ans" class="answer-input" placeholder="${q.type==="pair"?"(x, y)":"number"}" ${done?"disabled":""}></div>`;let fb=s.last==="ok"?`<div class="fb ok"><h3>Door ${s.idx+1} unlocked!</h3><p>${esc(q.why)}</p></div>`:s.last==="forced"?`<div class="fb warn"><h3>Door forced open. Not counted as solved.</h3><p>Answer: ${esc(SHOW[s.idx])}</p><p>${esc(q.why)}</p></div>`:s.wrongMsg?`<div class="fb bad">${esc(s.wrongMsg)}</div>`:"";
return `<div class="bar"><div><div class="eyebrow">${esc(s.period)} · Group</div><div class="team">${esc(s.team)}</div></div><div style="text-align:right"><div class="eyebrow">Time left</div><div class="timer" id="timer">${fmt(TIME_LIMIT-elapsed())}</div></div></div>${doors()}<form class="card" id="answerForm"><div class="room-head"><h2>Door ${s.idx+1} of 12</h2><span class="chip">${esc(q.topic)}</span></div><p class="prompt">${esc(q.prompt)}</p>${q.eqs?`<div class="eqs">${q.eqs.map(e=>`<span>${esc(e)}</span>`).join("")}</div>`:""}${q.graph?graphSVG():""}${input}<p class="err" id="err"></p><div class="btns" style="justify-content:space-between"><div class="tries">${dots}<span>${s.tries} of 3 tries used</span></div>${done?`<button class="primary" type="button" id="next">${s.idx===11?"Finish":"Go to door "+(s.idx+2)}</button>`:`<button class="primary">Try the lock</button>`}</div>${fb}</form>`}
function render(){const app=$("#app");app.innerHTML=teacherMode?renderTeacher():renderTeam();wire();if(!teacherMode&&teamState?.phase==="room"&&!session?.pausedAt){clearInterval(ticker);ticker=setInterval(updateTimer,400)}else clearInterval(ticker)}
function updateTimer(){if(!teamState||session?.pausedAt)return;let left=TIME_LIMIT-elapsed(),el=$("#timer");if(el){el.textContent=fmt(Math.ceil(left));el.classList.toggle("low",left<=300)}if(left<=0)finishTeam(true)}
async function persist(){if(!teamId)return;await api("POST",{action:"update",code:session.code,teamId,state:teamState})}
async function finishTeam(timeout=false){if(teamState.phase==="done")return;teamState.timedOut=timeout;teamState.used=Math.min(TIME_LIMIT,elapsed());if(!teamState.results[teamState.idx])teamState.results[teamState.idx]={tries:teamState.tries,solved:false,unreached:teamState.tries===0};for(let i=0;i<Q.length;i++)if(!teamState.results[i])teamState.results[i]={tries:0,solved:false,unreached:true};teamState.phase="done";await persist();render()}
async function submitAnswer(){let q=Q[teamState.idx],a=ANS[teamState.idx],correct=false;if(q.type==="mc"){if(mcPick===null){$("#err").textContent="Choose an answer first.";return}correct=String(mcPick)===String(a)}else{let n=nums($("#ans").value),need=q.type==="pair"?2:1;if(n.length!==need||n.some(Number.isNaN)){$("#err").textContent=q.type==="pair"?"Enter an ordered pair, such as (2, -3).":"Enter one number.";return}correct=q.type==="pair"?(close(n[0],a[0])&&close(n[1],a[1])):close(n[0],Number(a))}
teamState.tries++;if(correct){teamState.last="ok";teamState.results[teamState.idx]={tries:teamState.tries,solved:true};teamState.wrongMsg=""}else if(teamState.tries>=3){teamState.last="forced";teamState.results[teamState.idx]={tries:teamState.tries,solved:false};teamState.wrongMsg=""}else teamState.wrongMsg=`That did not open the lock. ${3-teamState.tries} tries left. Check your answer in both equations.`;await persist();render()}
function wire(){
if(teacherMode){
$("#create")?.addEventListener("click",async()=>{let pin=$("#pin").value;try{session=await api("POST",{action:"create",pin});localStorage.setItem("eg-teacher-code",session.code);render();startPolling()}catch(e){$("#error").textContent=e.message}});
$("#pause")?.addEventListener("click",async()=>{try{session=await api("POST",{action:session.pausedAt?"resume":"pause",code:session.code,pin:TEACHER_PIN});render()}catch(e){alert(e.message)}});
$("#refresh")?.addEventListener("click",refreshSession);
}else{
$("#joinForm")?.addEventListener("submit",async e=>{e.preventDefault();try{let d=await api("POST",{action:"join",code:$("#code").value.trim().toUpperCase(),team:$("#team").value.trim(),members:$("#members").value.trim(),period:$("#period").value});session=d.session;teamId=d.teamId;teamState=d.state;localStorage.setItem("eg-team-id",teamId);localStorage.setItem("eg-team-code",session.code);history.replaceState(null,"",location.pathname);render();startPolling()}catch(err){$("#error").textContent=err.message}});
$("#answerForm")?.addEventListener("submit",async e=>{e.preventDefault();if(!busy){busy=true;try{await submitAnswer()}catch(err){alert(err.message)}finally{busy=false}}});
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{mcPick=Number(b.dataset.i);document.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed",String(Number(x.dataset.i)===mcPick)))}));
$("#next")?.addEventListener("click",async()=>{if(teamState.idx===11){await finishTeam(false);return}teamState.idx++;teamState.tries=0;teamState.last=null;teamState.wrongMsg="";mcPick=null;await persist();render()});
}}
async function refreshSession(){session=await api("GET",{code:session.code});render()}
async function refreshTeam(){let wasPaused=!!session?.pausedAt;let d=await api("GET",{code:session.code,teamId});session=d.session;if(wasPaused!==!!session.pausedAt)render()} 
async function restore(){try{if(!savedCode)return;if(teacherMode){session=await api("GET",{code:savedCode});render();startPolling()}else if(teamId){let d=await api("GET",{code:savedCode,teamId});if(d.state){session=d.session;teamState=d.state;render();startPolling()}else{localStorage.removeItem("eg-team-id");localStorage.removeItem("eg-team-code");teamId=null}}}catch(e){console.warn("Could not restore saved game",e)}}
function startPolling(){clearInterval(poller);poller=setInterval(async()=>{try{if(teacherMode)await refreshSession();else await refreshTeam()}catch(e){console.warn(e)}},1200)}
if(teacherMode){render()}else{render()}
restore();
})();
</script></body></html>
